<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b0e14">
<title>Noelty status wall</title>
<style>
  :root {
    --bg: #0b0e14;
    --panel: #131822;
    --panel-2: #171d29;
    --line: #222a39;
    --text: #e8ebf1;
    --muted: #8a93a5;
    --faint: #5b6475;
    --ok: #3ddc84;
    --warn: #f5b942;
    --bad: #ff5a5f;
    --idle: #6b7486;
    --info: #4ea1ff;
    --gap: clamp(8px, 1.2vw, 16px);
    --pad: clamp(10px, 1.5vw, 20px);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); }
  body { overflow: hidden; -webkit-font-smoothing: antialiased; }

  /* The whole screen moves a few pixels now and then, so nothing stays lit in one place. */
  #wall {
    height: 100dvh; display: grid; grid-template-rows: auto 1fr 1fr auto; gap: var(--gap);
    padding: var(--pad); transform: translate(var(--shift-x, 0px), var(--shift-y, 0px));
    transition: transform 2s ease, filter 1s ease;
  }
  body.problem #wall { box-shadow: inset 0 0 0 3px var(--bad); }
  body.dim #wall { filter: brightness(0.45); }

  header {
    display: flex; align-items: center; gap: var(--gap); min-height: 44px;
  }
  .brand { font-weight: 700; letter-spacing: 0.02em; font-size: clamp(15px, 1.9vw, 22px); }
  .brand span { color: var(--muted); font-weight: 500; }
  .overall {
    margin-inline-start: auto; display: flex; align-items: center; gap: 10px;
    padding: 6px 14px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line);
    font-weight: 700; font-size: clamp(12px, 1.4vw, 16px); letter-spacing: 0.06em; text-transform: uppercase;
  }
  .overall.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, var(--line)); }
  .overall.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, var(--line)); }
  .overall.bad { color: #fff; background: var(--bad); border-color: var(--bad); }
  .overall.idle { color: var(--muted); }
  .meta { display: flex; align-items: center; gap: 14px; color: var(--muted); font-size: clamp(11px, 1.2vw, 14px); font-variant-numeric: tabular-nums; }
  .clock { color: var(--text); font-size: clamp(15px, 1.9vw, 22px); font-weight: 600; font-variant-numeric: tabular-nums; }
  .chip { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--idle); display: inline-block; }
  .chip.on i { background: var(--ok); }
  .chip.off i { background: var(--warn); }

  /* A row has as many columns as tiles (set in render), so a fifth tile narrows the row instead of wrapping. */
  .row { display: grid; grid-template-columns: repeat(var(--cols, 4), minmax(0, 1fr)); gap: var(--gap); min-height: 0; }
  .tile {
    position: relative; min-height: 0; overflow: hidden; display: flex; flex-direction: column;
    background: linear-gradient(180deg, var(--panel-2), var(--panel)); border: 1px solid var(--line);
    border-radius: 14px; padding: var(--pad);
  }
  .tile::before { content: ""; position: absolute; inset-inline-start: 0; inset-block: 0; width: 4px; background: var(--idle); }
  .tile.ok::before { background: var(--ok); }
  .tile.warn::before { background: var(--warn); }
  .tile.bad::before { background: var(--bad); }
  .tile.bad { background: linear-gradient(180deg, #3a1418, #24121a); border-color: var(--bad); }
  .tile.stale { opacity: 0.45; }
  .kind { color: var(--faint); font-size: clamp(9px, 1vw, 12px); letter-spacing: 0.12em; text-transform: uppercase; }
  .name { font-size: clamp(13px, 1.7vw, 20px); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .state { font-size: clamp(26px, 5.2vw, 60px); font-weight: 800; line-height: 1; letter-spacing: 0.01em; margin-top: auto; }
  .ok .state { color: var(--ok); } .warn .state { color: var(--warn); } .bad .state { color: var(--bad); }
  .tile:not(.ok):not(.warn):not(.bad) .state { color: var(--idle); }
  .row.dense .state { font-size: clamp(22px, 4.1vw, 48px); }
  .row.dense .name { font-size: clamp(12px, 1.45vw, 17px); }
  .row.dense .foot { gap: clamp(4px, 0.7vw, 10px); font-size: clamp(9px, 1.05vw, 12px); }
  .row.dense .versions .v b { font-size: clamp(13px, 1.7vw, 20px); }
  .sub { color: var(--muted); font-size: clamp(11px, 1.3vw, 15px); margin-top: 6px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sub b { color: var(--text); font-weight: 600; }
  .foot { display: flex; gap: clamp(6px, 1vw, 14px); margin-top: 10px; color: var(--muted); font-size: clamp(10px, 1.15vw, 13px); font-variant-numeric: tabular-nums; overflow: hidden; }
  .foot span { white-space: nowrap; }
  .foot b { color: var(--text); font-weight: 600; }
  svg.spark { width: 100%; height: clamp(22px, 5vh, 44px); margin-top: 8px; display: block; }
  svg.spark path.line { fill: none; stroke: var(--info); stroke-width: 1.6; vector-effect: non-scaling-stroke; }
  svg.spark path.area { fill: color-mix(in srgb, var(--info) 18%, transparent); stroke: none; }
  .bar { height: 6px; border-radius: 3px; background: var(--line); margin-top: 10px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--ok); border-radius: 3px; transition: width 1s linear; }
  .warn .bar > i { background: var(--warn); } .bad .bar > i { background: var(--bad); }

  .versions { gap: 0; }
  .versions .list { margin-top: auto; display: grid; gap: clamp(4px, 1vh, 10px); }
  .versions .v { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; border-top: 1px solid var(--line); padding-top: clamp(4px, 1vh, 10px); }
  .versions .v:first-child { border-top: 0; padding-top: 0; }
  .versions .v span { color: var(--muted); font-size: clamp(11px, 1.3vw, 15px); text-transform: uppercase; letter-spacing: 0.08em; }
  .versions .v b { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: clamp(14px, 2vw, 24px); font-weight: 600; }
  .versions .v b.none { color: var(--faint); }

  /* Versions as a thin strip along the bottom: title, then each build side by side. */
  #strip { min-height: 0; }
  .versions.strip { flex-direction: row; flex-wrap: wrap; align-items: center; gap: 8px clamp(16px, 3vw, 48px); min-height: 0; padding-block: clamp(8px, 1.2vh, 14px); }
  .versions.strip .head { display: flex; align-items: baseline; gap: 10px; flex-shrink: 0; }
  .versions.strip .name { margin-top: 0; }
  .versions.strip .list { margin-top: 0; display: flex; flex: 1; gap: clamp(16px, 3vw, 48px); }
  .versions.strip .v { border-top: 0; padding-top: 0; justify-content: flex-start; border-inline-start: 1px solid var(--line); padding-inline-start: clamp(16px, 3vw, 48px); }
  .versions.strip .v:first-child { border-inline-start: 0; padding-inline-start: 0; }
  .versions.strip .err { margin-top: 0; -webkit-line-clamp: 1; }

  .err { color: var(--bad); font-size: clamp(10px, 1.1vw, 13px); margin-top: 6px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

  /* A monitor or job tile opens its detail screen. */
  .tile[data-show] { cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .tile[data-show]:focus-visible { outline: 2px solid var(--info); outline-offset: 2px; }

  /* Detail screen: one monitor or job, in plain words. */
  #detail { display: none; min-height: 100dvh; padding: var(--pad); gap: var(--gap); align-content: start; }
  body.detail-open #wall { display: none; }
  body.detail-open #detail { display: grid; }
  body.detail-open { overflow: auto; }
  body.dim #detail { filter: brightness(0.45); }
  .d-head { display: flex; align-items: center; gap: var(--gap); flex-wrap: wrap; }
  .d-head .back { display: inline-flex; align-items: center; gap: 8px; height: 48px; padding: 0 20px; font-size: 17px; }
  .d-head .back::before { content: "←"; font-size: 20px; line-height: 1; }
  [dir='rtl'] .d-head .back::before { content: "→"; }
  .d-title { min-width: 0; }
  .d-title .name { font-size: clamp(20px, 2.8vw, 32px); white-space: normal; }
  .d-head .badge { margin-inline-start: auto; padding: 8px 18px; border-radius: 999px; font-weight: 800; font-size: clamp(16px, 2.2vw, 26px); letter-spacing: 0.04em; background: var(--panel); border: 1px solid var(--line); color: var(--idle); }
  .badge.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, var(--line)); }
  .badge.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, var(--line)); }
  .badge.bad { color: #fff; background: var(--bad); border-color: var(--bad); }
  .d-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--gap); }
  .panel { background: linear-gradient(180deg, var(--panel-2), var(--panel)); border: 1px solid var(--line); border-radius: 14px; padding: var(--pad); min-width: 0; }
  .panel.wide { grid-column: 1 / -1; }
  .panel h2 { margin: 0 0 10px; color: var(--faint); font-size: clamp(10px, 1.1vw, 13px); font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; }
  .panel p { margin: 0 0 8px; font-size: clamp(14px, 1.6vw, 18px); line-height: 1.5; }
  .panel p:last-child { margin-bottom: 0; }
  .panel p.hint { color: var(--muted); font-size: clamp(13px, 1.4vw, 16px); }
  .panel p .label { color: var(--muted); }
  .facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px 18px; margin: 0; }
  .facts div { min-width: 0; }
  .facts dt { color: var(--muted); font-size: clamp(11px, 1.2vw, 14px); }
  .facts dd { margin: 2px 0 0; font-size: clamp(16px, 2vw, 24px); font-weight: 600; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .facts dd small { display: block; color: var(--muted); font-size: clamp(11px, 1.2vw, 14px); font-weight: 400; }
  .panel svg.spark { height: clamp(90px, 22vh, 200px); }
  .chart-scale { display: flex; justify-content: space-between; gap: 10px; color: var(--muted); font-size: clamp(11px, 1.2vw, 14px); font-variant-numeric: tabular-nums; margin-top: 6px; }
  .chart-scale b { color: var(--text); font-weight: 600; }
  .events { list-style: none; margin: 0; padding: 0; display: grid; }
  .events li { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: baseline; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); font-size: clamp(13px, 1.5vw, 17px); font-variant-numeric: tabular-nums; }
  .events li:first-child { border-top: 0; padding-top: 0; }
  .events .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--idle); align-self: center; }
  .events .ok .dot { background: var(--ok); } .events .bad .dot { background: var(--bad); } .events .warn .dot { background: var(--warn); }
  .events .what small { display: block; color: var(--muted); font-size: 0.85em; }
  .events time { color: var(--muted); white-space: nowrap; }
  .empty { color: var(--muted); font-size: clamp(13px, 1.4vw, 16px); }
  @media (max-width: 720px), (orientation: portrait) { .d-grid { grid-template-columns: minmax(0, 1fr); } }

  /* Setup: shown once, on a device that has no keys yet. */
  #setup { position: fixed; inset: 0; display: none; place-items: center; background: var(--bg); padding: 20px; overflow: auto; }
  #setup.show { display: grid; }
  #setup form { width: min(560px, 100%); display: grid; gap: 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 24px; }
  #setup h1 { margin: 0; font-size: 22px; }
  #setup p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.5; }
  #setup label { display: grid; gap: 6px; font-size: 13px; color: var(--muted); }
  #setup input { height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--text); padding: 0 12px; font-size: 15px; font-family: ui-monospace, Menlo, Consolas, monospace; }
  #setup input:focus-visible, button:focus-visible { outline: 2px solid var(--info); outline-offset: 2px; }
  #setup .actions { display: flex; gap: 10px; flex-wrap: wrap; }
  button { height: 44px; padding: 0 18px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel-2); color: var(--text); font-size: 15px; font-weight: 600; cursor: pointer; }
  button.primary { background: var(--info); border-color: var(--info); color: #06121f; }
  button.awake { height: auto; min-height: 32px; padding: 4px 10px; border-radius: 999px; background: transparent; color: var(--muted); font-size: inherit; font-weight: 500; }
  button.awake.off { color: #1d1300; background: var(--warn); border-color: var(--warn); font-weight: 700; }
  button.awake.off i { background: #1d1300; }

  @media (orientation: portrait) {
    #wall { grid-template-rows: auto auto auto auto; overflow: auto; height: auto; min-height: 100dvh; }
    body { overflow: auto; }
    .row, .row.dense { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .tile { min-height: 150px; }
    .meta .hide-narrow { display: none; }
  }
  @media (max-width: 720px) { .meta .hide-narrow { display: none; } }
  @media (prefers-reduced-motion: reduce) { #wall, .bar > i { transition: none; } }
</style>
</head>
<body>

<main id="wall" aria-live="polite">
  <header>
    <div class="brand">Noelty <span>status</span></div>
    <div id="overall" class="overall idle">Loading…</div>
    <div class="meta">
      <span id="fresh" class="chip hide-narrow"><i></i><span>—</span></span>
      <button id="awake" class="chip awake" type="button" title="Keep the screen on and go full screen"><i></i><span>screen</span></button>
      <span id="clock" class="clock">--:--</span>
    </div>
  </header>
  <section id="monitors" class="row" aria-label="Uptime monitors"></section>
  <section id="bottom" class="row" aria-label="Background jobs"></section>
  <section id="strip" aria-label="Live builds"></section>
</main>

<main id="detail" aria-live="polite"></main>

<div id="setup">
  <form id="setup-form" autocomplete="off">
    <h1>Set up this screen</h1>
    <p>Paste <b>read-only</b> API keys. They are kept in this browser only (localStorage) and are sent only to the service they belong to. Never use a main or read-write key here.</p>
    <label>UptimeRobot read-only API key
      <input id="f-ur" name="ur" spellcheck="false" placeholder="ur…-…">
    </label>
    <label>Healthchecks.io read-only API key
      <input id="f-hc" name="hc" spellcheck="false" placeholder="hcr_…">
    </label>
    <label>Product API origin (for versions)
      <input id="f-api" name="api" spellcheck="false" value="https://app.noelty.io">
    </label>
    <div class="actions">
      <button class="primary" type="submit">Save and start</button>
      <button type="button" id="demo-btn">Show demo data</button>
    </div>
  </form>
</div>

<script>
'use strict';
/*
 * Noelty status wall: one screen for UptimeRobot monitors, Healthchecks.io checks and the live
 * build of each part of the product. A static page: it polls the three sources from the browser.
 *
 * Settings come from the URL fragment once (#ur=<key>&hc=<key>&api=<origin>&every=<seconds>
 * &dim=<from>-<to>) and are then kept in localStorage, so the keys leave the address bar.
 * #demo shows made-up data; #reset forgets the keys. A tapped tile opens its detail screen at
 * #show=<id> (with #demo&show=<id> in the demo), so the back button of the tablet closes it.
 */
const STORE = 'noelty-status-wall';
const STORE_VERSION = 2;
const MIN_EVERY = 20;
const DEFAULTS = { ur: '', hc: '', api: 'https://app.noelty.io', every: 20, dim: '' };
const $ = (id) => document.getElementById(id);

function loadConfig() {
  const hash = new URLSearchParams(location.hash.replace(/^#/, ''));
  if (hash.has('reset')) { try { localStorage.removeItem(STORE); } catch (e) { /* private mode */ } }
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem(STORE) || '{}'); } catch (e) { saved = {}; }
  // Before version 2 every save wrote the old default of 60 s, chosen or not: forget it.
  if (saved.v !== STORE_VERSION) delete saved.every;
  const cfg = { ...DEFAULTS, ...saved };
  let fromHash = false;
  for (const key of Object.keys(DEFAULTS)) {
    if (hash.has(key)) { cfg[key] = hash.get(key); fromHash = true; }
  }
  cfg.every = Math.max(MIN_EVERY, Number(cfg.every) || DEFAULTS.every);
  cfg.demo = hash.has('demo');
  if (fromHash) saveConfig(cfg);
  // The keys must not stay in the address bar or in the history.
  if (fromHash || hash.has('reset')) history.replaceState(null, '', location.pathname + (cfg.demo ? '#demo' : ''));
  return cfg;
}
function saveConfig(cfg) {
  const { ur, hc, api, every, dim } = cfg;
  try { localStorage.setItem(STORE, JSON.stringify({ v: STORE_VERSION, ur, hc, api, every, dim })); } catch (e) { /* private mode */ }
}

// ── Sources ────────────────────────────────────────────────────────────────

// UptimeRobot v2 monitor status. 0 paused, 1 not checked yet, 2 up, 8 seems down, 9 down.
const UR_STATE = {
  0: ['idle', 'PAUSED'], 1: ['idle', 'PENDING'], 2: ['ok', 'UP'], 8: ['warn', 'SEEMS DOWN'], 9: ['bad', 'DOWN'],
};

async function fetchUptimeRobot(key) {
  // No response_times_limit: the API then returns the last 24 hours, which the detail chart shows.
  const body = new URLSearchParams({
    api_key: key, format: 'json', custom_uptime_ratios: '1-7-30', custom_down_durations: '1',
    response_times: '1', logs: '1', logs_limit: '20',
  });
  const res = await fetch('https://api.uptimerobot.com/v2/getMonitors', { method: 'POST', body });
  if (!res.ok) throw new Error('UptimeRobot answered HTTP ' + res.status);
  const data = await res.json();
  if (data.stat !== 'ok') throw new Error((data.error && data.error.message) || 'UptimeRobot refused the key');
  return (data.monitors || []).map((m) => {
    const [level, label] = UR_STATE[m.status] || ['idle', 'STATUS ' + m.status];
    const ratios = String(m.custom_uptime_ratio || '').split('-').map(Number);
    const downs = String(m.custom_down_durations || '').split('-').map(Number);
    // Oldest first, for the charts.
    const points = (m.response_times || [])
      .map((t) => ({ at: t.datetime * 1000, ms: Number(t.value) }))
      .filter((p) => Number.isFinite(p.ms)).reverse();
    const all = points.map((p) => p.ms);
    // Log type 1 is "down" in this API; the newest one is when it last went down.
    const logs = (m.logs || []).map((l) => ({
      type: l.type, at: l.datetime * 1000, duration: Number(l.duration) || 0,
      reason: (l.reason && (l.reason.detail || l.reason.code)) || '',
    }));
    const lastDown = logs.find((l) => l.type === 1);
    // The tile keeps the same 24 newest points, and their average, it always showed.
    const times = all.slice(-24);
    return {
      name: m.friendly_name || 'monitor', level, label,
      ms: times.length ? times.reduce((a, b) => a + b, 0) / times.length : null,
      avg24: Number(m.average_response_time) || null,
      times, points, uptime: { d1: ratios[0], d7: ratios[1], d30: ratios[2] },
      down: { d1: downs[0], d7: downs[1], d30: downs[2] },
      lastDown: lastDown ? lastDown.at : null,
      url: m.url || null, interval: Number(m.interval) || null, logs,
    };
  });
}

const HC_STATE = {
  up: ['ok', 'UP'], grace: ['warn', 'LATE'], down: ['bad', 'DOWN'], new: ['idle', 'NEW'], paused: ['idle', 'PAUSED'],
};

async function fetchHealthchecks(key) {
  const res = await fetch('https://healthchecks.io/api/v3/checks/', { headers: { 'X-Api-Key': key } });
  if (!res.ok) throw new Error('Healthchecks answered HTTP ' + res.status);
  const data = await res.json();
  return (data.checks || []).map((c) => {
    const [level, label] = HC_STATE[c.status] || ['idle', String(c.status || '?').toUpperCase()];
    return {
      name: c.name || c.slug || 'check', level, label,
      last: c.last_ping ? Date.parse(c.last_ping) : null,
      next: c.next_ping ? Date.parse(c.next_ping) : null,
      period: Number(c.timeout) || null, grace: Number(c.grace) || 0,
      key: c.unique_key || null, desc: c.desc || '', schedule: c.schedule || null, tz: c.tz || null,
      pings: Number(c.n_pings) || 0, took: Number(c.last_duration) || null,
    };
  });
}

// Up/down changes of one check, newest first. A read-only key may read them; the pings it may not.
async function fetchFlips(key, uniqueKey) {
  const res = await fetch('https://healthchecks.io/api/v3/checks/' + encodeURIComponent(uniqueKey) + '/flips/', { headers: { 'X-Api-Key': key } });
  if (!res.ok) throw new Error('Healthchecks answered HTTP ' + res.status);
  const data = await res.json();
  return (Array.isArray(data) ? data : data.flips || [])
    .map((f) => ({ at: Date.parse(f.timestamp), up: f.up === 1 || f.up === true }))
    .filter((f) => Number.isFinite(f.at))
    .sort((a, b) => b.at - a.at);
}

async function fetchVersions(api) {
  const res = await fetch(api.replace(/\/$/, '') + '/api/v1/versions', { cache: 'no-store' });
  if (!res.ok) throw new Error('versions answered HTTP ' + res.status);
  const body = await res.json();
  return body.data || {};
}

function demoData() {
  const now = Date.now();
  const wave = (base) => Array.from({ length: 288 }, (_, i) => Math.round(base + 40 * Math.sin(i / 2.5) + (i * 37) % 23 + 30 * Math.sin(i / 40)));
  const monitor = (name, level, label, base, uptime, down, logs, url) => {
    const all = wave(base);
    const points = all.map((ms, i) => ({ at: now - (all.length - 1 - i) * 3e5, ms }));
    const times = all.slice(-24);
    const lastDown = logs.find((l) => l.type === 1);
    return {
      name, level, label, ms: level === 'bad' ? null : times.reduce((a, b) => a + b, 0) / times.length,
      avg24: base + 12, times, points, uptime, down, lastDown: lastDown ? lastDown.at : null,
      url, interval: 300, logs,
    };
  };
  const ev = (type, hoursAgo, minutes, reason) => ({ type, at: now - hoursAgo * 36e5, duration: minutes * 60, reason: reason || '' });
  const check = (name, level, label, lastH, periodS, graceS, extra) => ({
    name, level, label, last: now - lastH * 36e5, next: now - lastH * 36e5 + periodS * 1000,
    period: periodS, grace: graceS, key: 'demo-' + name.replace(/\W+/g, '-'), desc: '', schedule: null, tz: null,
    pings: 412, took: null, ...extra,
  });
  return {
    monitors: [
      monitor('Noelty API health', 'ok', 'UP', 180, { d1: 100, d7: 99.98, d30: 99.95 }, { d1: 0, d7: 120, d30: 1320 },
        [ev(2, 9 * 24 - 0.2, 9 * 24 * 60, 'OK'), ev(1, 9 * 24, 12, 'Connection Timeout'), ev(2, 21 * 24, 288 * 60, 'OK'), ev(98, 30 * 24, 0, 'Started')],
        'https://app.noelty.io/api/v1/healthz'),

        [ev(2, 18 * 24, 18 * 24 * 60, 'OK'), ev(1, 18 * 24 + 0.05, 3, 'HTTP 502 - Bad Gateway'), ev(98, 30 * 24, 0, 'Started')],
        'https://app.noelty.io/'),
      monitor('Noelty admin', 'ok', 'UP', 100, { d1: 100, d7: 100, d30: 100 }, { d1: 0, d7: 0, d30: 0 },
        [ev(98, 30 * 24, 0, 'Started')], 'https://admin.noelty.io/'),
      monitor('Noelty landing', 'bad', 'DOWN', 140, { d1: 96.4, d7: 99.4, d30: 99.8 }, { d1: 420, d7: 420, d30: 420 },
        [ev(1, 7 / 60, 7, 'HTTP 503 - Service Unavailable'), ev(2, 12 * 24, 12 * 24 * 60, 'OK'), ev(98, 30 * 24, 0, 'Started')],
        'https://noelty.io/'),
    ],
    checks: [
      check('noelty text sweep', 'ok', 'UP', 2.2, 21600, 3600),
      check('noelty key probe', 'warn', 'LATE', 6.4, 21600, 3600),

}

function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined && text !== null) node.textContent = text; // never innerHTML: names come from outside
  return node;
}
function ago(ms) {
  if (ms === null || !Number.isFinite(ms)) return '—';
  const s = Math.max(0, Math.round(ms / 1000));
  if (s < 90) return s + 's';
  const m = Math.round(s / 60);
  if (m < 90) return m + 'm';
  const h = Math.floor(m / 60);
  if (h < 48) return h + 'h ' + (m % 60) + 'm';
  return Math.floor(h / 24) + 'd ' + (h % 24) + 'h';
}
function pct(v) {
  if (!Number.isFinite(v)) return '—';
  return (v >= 100 ? '100' : v.toFixed(2)) + '%';
}
function spark(values) {
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('class', 'spark');
  svg.setAttribute('viewBox', '0 0 100 30');
  svg.setAttribute('preserveAspectRatio', 'none');
  svg.setAttribute('aria-hidden', 'true');
  if (values.length < 2) return svg;
  const max = Math.max(...values), min = Math.min(...values), span = Math.max(1, max - min);
  const pts = values.map((v, i) => [(i / (values.length - 1)) * 100, 27 - ((v - min) / span) * 24]);
  const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(2) + ' ' + p[1].toFixed(2)).join(' ');
  for (const [cls, path] of [['area', d + ' L100 30 L0 30 Z'], ['line', d]]) {
    const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    p.setAttribute('class', cls); p.setAttribute('d', path); svg.appendChild(p);
  }
  return svg;
}

function monitorTile(m, stale) {
  const tile = el('article', 'tile ' + m.level + (stale ? ' stale' : ''));
  tile.append(el('div', 'kind', 'Uptime'), el('div', 'name', m.name), el('div', 'state', m.label));
  const sub = el('div', 'sub');
  if (m.level === 'bad' && m.lastDown) { sub.append('down for ', el('b', '', ago(Date.now() - m.lastDown))); }
  else if (m.ms) { sub.append('response ', el('b', '', Math.round(m.ms) + ' ms')); }
  else sub.textContent = ' ';
  tile.append(sub, spark(m.times));
  const foot = el('div', 'foot');
  for (const [label, v] of [['24h', m.uptime.d1], ['7d', m.uptime.d7], ['30d', m.uptime.d30]]) {
    const s = el('span', '', label + ' '); s.append(el('b', '', pct(v))); foot.append(s);
  }
  tile.append(foot);
  return tile;
}

function checkTile(c, stale) {
  const now = Date.now();
  const tile = el('article', 'tile ' + c.level + (stale ? ' stale' : ''));
  tile.append(el('div', 'kind', 'Background job'), el('div', 'name', c.name), el('div', 'state', c.label));
  const sub = el('div', 'sub');
  sub.append('last ping ', el('b', '', c.last ? ago(now - c.last) + ' ago' : 'never'));
  tile.append(sub);
  const bar = el('div', 'bar'), fill = el('i');
  const done = c.last && c.period ? Math.min(1, (now - c.last) / (c.period * 1000)) : 0;
  fill.style.width = Math.round(done * 100) + '%';
  bar.append(fill); tile.append(bar);
  const foot = el('div', 'foot');
  const next = el('span', '', c.next && c.next > now ? 'next in ' : 'expected ');
  next.append(el('b', '', c.next ? (c.next > now ? ago(c.next - now) : ago(now - c.next) + ' ago') : '—'));
  const every = el('span', '', 'every '); every.append(el('b', '', c.period ? ago(c.period * 1000) : '—'));
  foot.append(next, every); tile.append(foot);
  return tile;
}

function versionsTile(versions, error, stale) {
  const tile = el('article', 'tile versions strip ' + (error ? 'warn' : 'ok') + (stale ? ' stale' : ''));
  const head = el('div', 'head');
  head.append(el('div', 'name', 'Versions'), el('div', 'kind', 'Live builds'));

  const list = el('div', 'list');
  for (const part of ['back', 'front', 'admin']) {
    const row = el('div', 'v'); const v = versions && versions[part];
    row.append(el('span', '', part), el('b', v ? '' : 'none', v ? String(v).replace(part + '-', '') : '—'));
    list.append(row);
  }
  tile.append(list);
  return tile;
}

function messageTile(kind, title, text, level) {
  const tile = el('article', 'tile ' + (level || ''));
  tile.append(el('div', 'kind', kind), el('div', 'name', title), el('div', 'err', text));

}

function about(list, fallback, name) {
  return list.find((a) => a.match.test(name)) || fallback;
}

// The detail screen shows one item. Its id is the kind and the name: "uptime:<name>" or "job:<name>".
const view = { id: null, flips: { key: null, data: null, at: 0, error: null } };
let lastInput = Date.now();
// With nobody touching it, the tablet goes back to the wall after this long.
const DETAIL_IDLE_MS = 2 * 60 * 1000;

function routeHash(id) {
  const parts = [];
  if (cfg.demo) parts.push('demo');
  if (id) parts.push('show=' + encodeURIComponent(id));
  return location.pathname + (parts.length ? '#' + parts.join('&') : '');
}
function openDetail(id) {
  history.pushState({ detail: true }, '', routeHash(id));
  applyRoute();
  window.scrollTo(0, 0);
}
function closeDetail() {
  if (history.state && history.state.detail) history.back();
  else { history.replaceState(null, '', routeHash(null)); applyRoute(); }
}
function applyRoute() {
  const id = new URLSearchParams(location.hash.replace(/^#/, '')).get('show');
  const changed = id !== view.id;
  view.id = id;
  document.body.classList.toggle('detail-open', !!id);
  if (changed) { view.flips = { key: null, data: null, at: 0, error: null }; loadFlips(); }
  render();
}

async function loadFlips() {
  const c = view.id && view.id.startsWith('job:') ? findItem(view.id) : null;
  if (!c || !c.key) return;
  if (cfg.demo) { view.flips = { key: c.key, data: demoData().flips, at: Date.now(), error: null }; return render(); }
  if (!cfg.hc) return;
  try { view.flips = { key: c.key, data: await fetchFlips(cfg.hc, c.key), at: Date.now(), error: null }; }
  catch (e) { view.flips = { ...view.flips, key: c.key, error: (e && e.message) || 'request failed' }; }
  render();
}

function findItem(id) {
  if (!id) return null;
  const [kind, ...rest] = id.split(':'); const name = rest.join(':');
  const list = kind === 'uptime' ? state.monitors.data : kind === 'job' ? state.checks.data : null;
  return (list || []).find((x) => x.name === name) || null;
}

function when(ms) {
  if (!Number.isFinite(ms)) return '—';
  const d = new Date(ms), today = new Date();
  const time = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  if (d.toDateString() === today.toDateString()) return 'today at ' + time;
  return d.toLocaleDateString([], { day: 'numeric', month: 'short' }) + ' at ' + time;
}
// A period in words: "6h", not "6h 0m".
function every(seconds) {
  return Number.isFinite(seconds) && seconds ? ago(seconds * 1000).replace(/ 0[mh]$/, '') : '—';
}
function span(seconds) {
  if (!Number.isFinite(seconds)) return '—';
  return seconds ? ago(seconds * 1000) : 'none';
}
function fact(label, value, note) {
  const box = el('div'); const dd = el('dd', '', value);
  if (note) dd.append(el('small', '', note));
  box.append(el('dt', '', label), dd);
  return box;
}
function panel(title, wide) {
  const p = el('section', 'panel' + (wide ? ' wide' : ''));
  p.append(el('h2', '', title));
  return p;
}
function para(label, text, cls) {
  const p = el('p', cls || '');
  if (label) p.append(el('span', 'label', label + ' '));
  p.append(text);
  return p;
}
function eventRow(level, what, note, at) {
  const li = el('li', level); const box = el('div', 'what', what);
  if (note) box.append(el('small', '', note));
  const t = el('time', '', when(at)); t.dateTime = new Date(at).toISOString();
  li.append(el('i', 'dot'), box, t);
  return li;
}

function detailHead(kind, item, source) {
  const head = el('div', 'd-head');
  const back = el('button', 'back', 'Back'); back.type = 'button';
  back.addEventListener('click', closeDetail);
  const title = el('div', 'd-title');
  const age = source.at ? 'data from ' + ago(Date.now() - source.at) + ' ago' : 'no data yet';
  title.append(el('div', 'kind', kind + ' · ' + age), el('div', 'name', item ? item.name : 'Not found'));
  head.append(back, title);
  if (item) head.append(el('div', 'badge ' + item.level, item.label));
  return head;
}

function monitorDetail(m) {
  const now = Date.now(), a = about(ABOUT_MONITORS, ABOUT_MONITOR, m.name);
  const grid = el('div', 'd-grid');

  const newest = m.logs.find((l) => l.type === 1 || l.type === 2);
  const words = panel('Right now', true);
  if (m.level === 'ok') words.append(para('', 'Answers' + (m.ms ? ' in about ' + Math.round(m.ms) + ' ms' : '') + (newest ? ', without a break for ' + ago(now - newest.at) : '') + '. UptimeRobot checks it from outside every ' + (m.interval ? every(m.interval) : 'few minutes') + '.'));
  else if (m.level === 'bad') words.append(para('', 'Not answering' + (m.lastDown ? ' for ' + ago(now - m.lastDown) : '') + (newest && newest.reason ? ' (' + newest.reason + ')' : '') + '. ' + a.red));
  else if (m.level === 'warn') words.append(para('', 'The last check failed. UptimeRobot is checking again before it calls this down.'));
  else words.append(para('', m.label === 'PAUSED' ? 'Monitoring is paused in UptimeRobot: nothing is being checked.' : 'Not checked yet.'));
  grid.append(words);

  const what = panel('What this is');
  what.append(para('', a.what), para('If it is red:', a.red, 'hint'));
  const look = panel('Where to look');
  look.append(para('', a.look), para('', 'Alerts go to Discord and email when this turns red.', 'hint'));
  grid.append(what, look);

  const facts = el('dl', 'facts');
  facts.append(
    fact('Checked every', every(m.interval)),
    fact('Response, now', m.points.length && m.level !== 'bad' ? Math.round(m.points[m.points.length - 1].ms) + ' ms' : '—', m.avg24 ? 'average over 24h ' + Math.round(m.avg24) + ' ms' : null),
    fact('Up, 24 hours', pct(m.uptime.d1), 'down ' + span(m.down.d1)),
    fact('Up, 7 days', pct(m.uptime.d7), 'down ' + span(m.down.d7)),
    fact('Up, 30 days', pct(m.uptime.d30), 'down ' + span(m.down.d30)),
    fact('Last time down', m.lastDown ? when(m.lastDown) : 'not in the recent log'),
  );
  if (m.url) facts.append(fact('Address', m.url));
  const numbers = panel('Numbers', true); numbers.append(facts); grid.append(numbers);

  const chart = panel('Response time, last 24 hours', true);
  if (m.points.length > 1) {
    const ms = m.points.map((p) => p.ms);
    chart.append(spark(ms));
    const scale = el('div', 'chart-scale');
    const bit = (label, v) => { const s = el('span', '', label + ' '); s.append(el('b', '', v)); return s; };
    scale.append(el('span', '', when(m.points[0].at)), bit('fastest', Math.round(Math.min(...ms)) + ' ms'),
      bit('slowest', Math.round(Math.max(...ms)) + ' ms'), el('span', '', 'now'));
    chart.append(scale, para('', 'How long the page took to answer each check. Spikes are slow answers; a gap means it did not answer at all.', 'hint'));
  } else chart.append(el('p', 'empty', 'No response times yet.'));
  grid.append(chart);

  const log = panel('Recent events', true);
  const list = el('ul', 'events');
  m.logs.forEach((l, i) => {
    const ongoing = i === 0;
    if (l.type === 1) list.append(eventRow('bad', 'Went down', (l.reason ? l.reason + ' · ' : '') + (ongoing && m.level === 'bad' ? 'still down' : 'was down ' + span(l.duration)), l.at));
    else if (l.type === 2) list.append(eventRow('ok', 'Came back up', ongoing ? 'up since then' : 'stayed up ' + span(l.duration), l.at));
    else if (l.type === 98) list.append(eventRow('', 'Monitoring started', null, l.at));
    else if (l.type === 99) list.append(eventRow('', 'Monitoring paused', null, l.at));
  });
  if (list.children.length) log.append(list);
  else log.append(el('p', 'empty', 'Nothing in the recent log.'));
  grid.append(log);
  return grid;
}

function jobDetail(c) {
  const now = Date.now(), a = about(ABOUT_JOBS, ABOUT_JOB, c.name);
  const redAt = c.next ? c.next + c.grace * 1000 : null;
  const grid = el('div', 'd-grid');

  const words = panel('Right now', true);
  if (c.level === 'ok') words.append(para('', 'Reported ' + (c.last ? ago(now - c.last) + ' ago' : '—') + ', on time.' + (c.next ? ' The next report is due in ' + ago(c.next - now) + '.' : '')));
  else if (c.level === 'warn') words.append(para('', 'Late: the report was due ' + (c.next ? ago(now - c.next) + ' ago' : 'already') + '. It turns red ' + (redAt ? when(redAt) : 'soon') + ' unless it reports.'));
  else if (c.level === 'bad') words.append(para('', 'No report since ' + (c.last ? when(c.last) : 'ever') + ', or the job reported a failure. ' + a.red));
  else words.append(para('', c.label === 'PAUSED' ? 'Paused in Healthchecks: a missing report raises no alarm.' : 'Created, but no report has arrived yet.'));
  grid.append(words);

  const what = panel('What this does');
  what.append(para('', c.desc || a.what), para('If it is red:', a.red, 'hint'));
  const look = panel('Where to look');
  look.append(para('', a.look), para('', 'Alerts go to Discord when this turns red.', 'hint'));
  grid.append(what, look);

  const facts = el('dl', 'facts');
  facts.append(
    fact('Last report', c.last ? ago(now - c.last) + ' ago' : 'never', c.last ? when(c.last) : null),
    fact(c.next && c.next < now ? 'Overdue by' : 'Next report due in', c.next ? ago(Math.abs(c.next - now)) : '—', c.next ? when(c.next) : null),
    fact('Turns red', redAt ? (redAt > now ? 'in ' + ago(redAt - now) : 'already') : '—', redAt ? when(redAt) : null),
    fact('Runs', c.schedule ? c.schedule : c.period ? 'every ' + every(c.period) : '—', c.schedule ? 'cron' + (c.tz ? ', ' + c.tz : '') : null),
    fact('Grace time', c.grace ? every(c.grace) : 'none', 'how late a report may be'),
  );
  if (c.took) facts.append(fact('Last round took', ago(c.took * 1000)));
  if (c.pings) facts.append(fact('Reports so far', String(c.pings)));
  // The level on the panel colours the bar the way the tile does.
  const numbers = panel('Numbers', true); numbers.classList.add(c.level); numbers.append(facts);
  const bar = el('div', 'bar'), fill = el('i');
  const done = c.last && c.period ? Math.min(1, (now - c.last) / (c.period * 1000)) : 0;
  fill.style.width = Math.round(done * 100) + '%'; bar.append(fill);
  numbers.append(bar, para('', 'The bar fills up until the next report is due.', 'hint'));
  grid.append(numbers);

  const how = panel('How this alarm works', true);
  how.append(
    para('', 'Healthchecks.io does not look at the server. The job reports in after every round, and Healthchecks only notices when a report does not come.'),
    para('', 'A report is expected every ' + (c.period ? every(c.period) : 'period') + '. When it is late the tile turns amber; after ' + (c.grace ? every(c.grace) : 'no') + ' more it turns red and an alert goes out.'),
  );
  if (c.level === 'ok' && redAt) how.append(para('', 'So if the whole server goes down now, this tile stays green until ' + when(redAt) + ': the uptime monitors notice that first.', 'hint'));
  grid.append(how);

  const log = panel('Up and down', true);
  const flips = view.flips.key === c.key ? view.flips : null;
  if (flips && flips.data && flips.data.length) {
    const list = el('ul', 'events');
    flips.data.slice(0, 20).forEach((f, i) => {
      const until = i === 0 ? now : flips.data[i - 1].at;
      list.append(f.up
        ? eventRow('ok', 'Back on time', i === 0 ? 'fine since then' : 'fine for ' + ago(until - f.at), f.at)
        : eventRow('bad', 'Went red', (i === 0 ? 'still red' : 'red for ' + ago(until - f.at)) + ' · a report was missing or failed', f.at));
    });
    log.append(list);
  } else if (flips && flips.error) log.append(el('p', 'empty', 'Could not load the history: ' + flips.error));
  else if (flips && flips.data) log.append(el('p', 'empty', 'Never went red.'));
  else log.append(el('p', 'empty', 'Loading…'));
  grid.append(log);
  return grid;
}

function renderDetail() {
  const box = $('detail');
  const scroll = window.scrollY;
  const isJob = view.id.startsWith('job:');
  const item = findItem(view.id);
  const source = isJob ? state.checks : state.monitors;
  const parts = [detailHead(isJob ? 'Background job' : 'Uptime monitor', item, source)];
  if (item) parts.push(isJob ? jobDetail(item) : monitorDetail(item));
  else {
    const p = panel('Not found', true);
    p.append(el('p', 'empty', source.data ? 'This item is no longer in the list.' : 'Waiting for data…'));
    parts.push(p);
  }
  box.replaceChildren(...parts);
  window.scrollTo(0, scroll);
}

// ── State and loop ─────────────────────────────────────────────────────────

const cfg = loadConfig();
const state = {
  monitors: { data: null, at: 0, error: null },
  checks: { data: null, at: 0, error: null },
  versions: { data: null, at: 0, error: null },
};
// Data older than this many polls is shown as stale: a frozen screen must not look healthy.
const STALE_AFTER = 3;

async function refresh() {
  if (cfg.demo) {
    const demo = demoData(); const now = Date.now();
    state.monitors = { data: demo.monitors, at: now, error: null };
    state.checks = { data: demo.checks, at: now, error: null };
    state.versions = { data: demo.versions, at: now, error: null };
  } else await fetchAll();
  render();
  // An open job keeps its history fresh too.
  if (view.id && view.id.startsWith('job:')) loadFlips();
}

async function fetchAll() {
  const jobs = [
    ['monitors', cfg.ur ? () => fetchUptimeRobot(cfg.ur) : null, 'no UptimeRobot key'],
    ['checks', cfg.hc ? () => fetchHealthchecks(cfg.hc) : null, 'no Healthchecks key'],
    ['versions', cfg.api ? () => fetchVersions(cfg.api) : null, 'no API origin'],
  ];
  await Promise.all(jobs.map(async ([name, job, missing]) => {
    if (!job) { state[name].error = missing; return; }
    try { state[name] = { data: await job(), at: Date.now(), error: null }; }
    catch (e) { state[name].error = (e && e.message) || 'request failed'; }
  }));
}

// Data older than this is shown as stale, but never sooner than STALE_MIN_S: one refused poll
// (UptimeRobot allows 10 a minute) must not grey out the wall.
const STALE_MIN_S = 180;
function isStale(source) {
  return !source.at || Date.now() - source.at > Math.max(STALE_AFTER * cfg.every, STALE_MIN_S) * 1000;
}

// A monitor or job tile opens its detail screen; the versions tile and message tiles do not.
function clickable(tile, id, name) {
  tile.dataset.show = id;
  tile.tabIndex = 0;
  tile.setAttribute('role', 'button');
  tile.setAttribute('aria-label', name + ': details');
  return tile;
}

function render() {
  const now = Date.now();
  if (view.id) renderDetail();
  const mon = $('monitors'), bottom = $('bottom');
  mon.replaceChildren(); bottom.replaceChildren();

  const mStale = isStale(state.monitors), cStale = isStale(state.checks), vStale = isStale(state.versions);
  if (state.monitors.data) state.monitors.data.forEach((m) => mon.append(clickable(monitorTile(m, mStale), 'uptime:' + m.name, m.name)));
  if (!state.monitors.data || (state.monitors.error && mStale)) {
    mon.append(messageTile('Uptime', 'UptimeRobot', state.monitors.error || 'loading…', state.monitors.error ? 'warn' : ''));
  }
  if (state.checks.data) state.checks.data.forEach((c) => bottom.append(clickable(checkTile(c, cStale), 'job:' + c.name, c.name)));
  if (!state.checks.data || (state.checks.error && cStale)) {
    bottom.append(messageTile('Background jobs', 'Healthchecks.io', state.checks.error || 'loading…', state.checks.error ? 'warn' : ''));
  }
  $('strip').replaceChildren(versionsTile(state.versions.data, state.versions.data ? null : state.versions.error, vStale && !!state.versions.data));

  for (const row of [mon, bottom]) {
    row.style.setProperty('--cols', Math.max(4, row.children.length));
    row.classList.toggle('dense', row.children.length > 4);
  }

  const items = [...(state.monitors.data || []), ...(state.checks.data || [])];
  const bad = items.filter((i) => i.level === 'bad').length;
  const warn = items.filter((i) => i.level === 'warn').length;
  const blind = [state.monitors, state.checks].filter((s) => s.error || isStale(s)).length;
  const overall = $('overall');
  let cls = 'ok', text = 'All systems up';
  if (bad) { cls = 'bad'; text = bad + (bad === 1 ? ' problem' : ' problems'); }
  else if (blind) { cls = 'warn'; text = 'No fresh data'; }
  else if (warn) { cls = 'warn'; text = warn + ' late'; }
  else if (!items.length) { cls = 'idle'; text = 'Loading…'; }
  overall.className = 'overall ' + cls; overall.textContent = text;
  document.body.classList.toggle('problem', bad > 0);
  document.title = (bad ? '🔴 ' + bad + ' down' : blind ? '🟡 no data' : '🟢 up') + ' · Noelty status';

  const newest = Math.max(state.monitors.at, state.checks.at);
  const fresh = $('fresh');
  fresh.className = 'chip hide-narrow ' + (blind ? 'off' : 'on');
  fresh.lastElementChild.textContent = newest ? 'updated ' + ago(now - newest) + ' ago' : 'no data yet';
}

function tick() {
  const d = new Date();
  $('clock').textContent = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  // Night dimming: dim=23-7 lowers the brightness between those local hours.
  const m = /^(\d{1,2})-(\d{1,2})$/.exec(cfg.dim || '');
  if (m) {
    const h = d.getHours(), from = +m[1], to = +m[2];
    document.body.classList.toggle('dim', from > to ? (h >= from || h < to) : (h >= from && h < to));
  }
  if (view.id && Date.now() - lastInput > DETAIL_IDLE_MS) closeDetail();
  else render();
}

// A static picture lit for months leaves a mark: move everything a few pixels every 5 minutes.
function shift() {
  const wall = $('wall');
  wall.style.setProperty('--shift-x', Math.round((Math.random() - 0.5) * 8) + 'px');
  wall.style.setProperty('--shift-y', Math.round((Math.random() - 0.5) * 8) + 'px');
}

// ── Keeping the screen on ──────────────────────────────────────────────────

let lock = null;
async function keepAwake() {
  const chip = $('awake');
  if (!('wakeLock' in navigator)) {
    chip.className = 'chip awake'; chip.lastElementChild.textContent = 'no wake lock here';
    return false;
  }
  try {
    lock = await navigator.wakeLock.request('screen');
    lock.addEventListener('release', () => { chip.className = 'chip awake off'; chip.lastElementChild.textContent = 'tap: keep screen on'; });
    chip.className = 'chip awake on'; chip.lastElementChild.textContent = 'screen stays on';
    return true;
  } catch (e) {
    // Refused (battery saver, or the browser wants a tap first): ask for one.
    chip.className = 'chip awake off'; chip.lastElementChild.textContent = 'tap: keep screen on';
    return false;
  }
}
// The lock is dropped whenever the page is hidden; take it again when it is back.
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') { keepAwake(); refresh(); }
});
$('awake').addEventListener('click', async () => {
  await keepAwake();
  if (document.documentElement.requestFullscreen && !document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(() => {});
  }
});
// A double tap anywhere toggles full screen. Not on a tile or the detail screen: there the first
// tap already opened something.
document.addEventListener('dblclick', (e) => {
  if (view.id || (e.target.closest && e.target.closest('[data-show]'))) return;
  if (document.fullscreenElement) document.exitFullscreen();
  else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
});

// ── Detail navigation ──────────────────────────────────────────────────────

for (const type of ['pointerdown', 'keydown', 'wheel']) {
  document.addEventListener(type, () => { lastInput = Date.now(); }, { passive: true });
}
for (const row of [$('monitors'), $('bottom')]) {
  row.addEventListener('click', (e) => {
    const tile = e.target.closest('[data-show]');
    if (tile) { lastInput = Date.now(); openDetail(tile.dataset.show); }
  });
  row.addEventListener('keydown', (e) => {
    const tile = e.target.closest('[data-show]');
    if (tile && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); openDetail(tile.dataset.show); }
  });
}
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && view.id) closeDetail(); });
// The back button of the tablet, or Back on the screen, walks the history.
window.addEventListener('popstate', applyRoute);

// ── Start ──────────────────────────────────────────────────────────────────

function start() {
  $('setup').classList.remove('show');
  applyRoute();
  refresh();
  setInterval(refresh, cfg.every * 1000);
  setInterval(tick, 5000);
  setInterval(shift, 5 * 60 * 1000);
  tick();
  keepAwake();
}

$('setup-form').addEventListener('submit', (e) => {
  e.preventDefault();
  cfg.ur = $('f-ur').value.trim(); cfg.hc = $('f-hc').value.trim(); cfg.api = $('f-api').value.trim();
  saveConfig(cfg);
  start();
});
$('demo-btn').addEventListener('click', () => { cfg.demo = true; start(); });

if (cfg.demo || cfg.ur || cfg.hc) start();
else { $('f-api').value = cfg.api; $('setup').classList.add('show'); }
</script>
</body>
</html>
